[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.9"
description = "Fast, quirky and experimental like Luna Lovegood"
requires-python = ">=3.10"

[project.scripts]
luna = "luna.cli:main"
luna-gui = "luna.gui:main"

[tool.setuptools.packages.find]
include = ["luna*"]
